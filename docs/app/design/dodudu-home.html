<style>
  /*
   * 도도두 홈 시안 — 손그림 감성의 첫 화면.
   *
   * 색은 전부 여기 :root 한 블록에서만 정한다 (앱의 globals.css와 같은 규칙).
   * 바깥 배경(--page*)만 어두운 화면을 따라가고, 폰 안쪽은 기기 화면이라 늘 밝다.
   */
  :root {
    /* 바깥 — 시안을 올려두는 책상 */
    --page: #efe7d9;
    --page-2: #f7f1e6;
    --page-ink: #857b6f;
    --page-line: #ded4c4;
    --shadow: 0 26px 60px rgba(96, 82, 62, .18), 0 3px 10px rgba(96, 82, 62, .08);

    /* 안쪽 — 앱 화면 */
    --bg: #fdf8e7;
    --card: #fffdf6;
    --band: #fcf1cf;
    --ink: #4b443e;
    --ink2: #8b8177;
    --ink3: #aba298;
    --line: #efe7d6;
    --edge: #dcd4c4;

    --tomato: #ee4b3b;
    --leaf: #8daf4b;
    --sprout: #a9ce7e;
    --sprout-deep: #93bd63;

    --ok-band: #e4f0d2;
    --ok-ink: #6e9440;
    --warn-band: #fbdcda;
    --warn-ink: #d9584a;
    --sage: #7fb08a;

    --hand: 'Uiyeon', 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;

    --dirt: #d9b78d;
    --grass: #cfe39a;
    --sun: #ffd34e;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #221f1c;
      --page-2: #2b2723;
      --page-ink: #a79c8e;
      --page-line: #3a342d;
      --shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --page: #221f1c;
    --page-2: #2b2723;
    --page-ink: #a79c8e;
    --page-line: #3a342d;
    --shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 16px 22px;
    background: radial-gradient(120% 90% at 50% 0%, var(--page-2), var(--page));
    color: var(--page-ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ─────────────── 기기 ─────────────── */

  .phone {
    position: relative;
    width: min(392px, 100%);
    height: min(846px, 100dvh - 92px);
    min-height: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 40px;
    background: var(--bg);
    box-shadow: var(--shadow);
    color: var(--ink);
    font-family: var(--hand);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -.01em;
  }

  /* 종이결 — 아주 옅게 깔아 크레용 그림과 톤을 맞춘다 */
  .phone::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: .5;
    background-image: radial-gradient(rgba(150, 130, 90, .09) .6px, transparent .7px);
    background-size: 4px 4px;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding: 0 20px calc(112px);
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ─────────────── 머리줄 ─────────────── */

  .appbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 2px 6px;
  }

  .logo {
    flex: 1;
    text-align: center;
    font-family: var(--hand);
    font-size: 38px;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--leaf);
    margin: 0;
  }
  .logo .do { color: var(--tomato); }
  .logo .dot {
    display: inline-block;
    width: .15em;
    height: .15em;
    margin: 0 .1em;
    border-radius: 50%;
    background: var(--leaf);
    vertical-align: middle;
  }

  .icon-btn {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:active { transform: scale(.9); background: rgba(0, 0, 0, .04); }
  .icon-btn svg { width: 25px; height: 25px; }
  .icon-btn .dot-alert {
    position: absolute;
    top: 3px;
    right: 4px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--tomato);
    box-shadow: 0 0 0 2px var(--bg);
  }

  /* ─────────────── 인사 ─────────────── */

  .hello {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 6px 0 18px;
    min-height: 168px;
  }

  .hello-words {
    flex: 1;
    padding-bottom: 34px;
    font-family: var(--hand);
    font-size: 23px;
    line-height: 1.45;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .sun {
    display: block;
    width: 62px;
    height: 62px;
    margin: 0 0 4px -6px;
    animation: sway 7s ease-in-out infinite;
  }

  .hello-art {
    flex: none;
    width: 208px;
    margin: 0 -24px -6px -46px;
    animation: bob 5.5s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(-1.2deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(14deg); }
  }

  /* ─────────────── 카드 ─────────────── */

  .card {
    border-radius: 22px;
    background: var(--card);
    box-shadow: 0 8px 22px rgba(120, 100, 70, .07);
    border: 1px solid var(--line);
  }
  .card + .card { margin-top: 16px; }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 20px 4px;
  }
  .card-title {
    margin: 0;
    flex: 1;
    font-family: var(--hand);
    font-size: 22px;
    letter-spacing: -.02em;
  }

  .pill {
    flex: none;
    padding: 4px 13px;
    border-radius: 999px;
    font-family: var(--hand);
    font-size: 16px;
    line-height: 1.35;
    background: var(--warn-band);
    color: var(--warn-ink);
    font-variant-numeric: tabular-nums;
    transition: background .2s ease, color .2s ease;
  }
  .pill.clear { background: var(--ok-band); color: var(--ok-ink); }

  .badge {
    flex: none;
    padding: 3px 12px;
    border-radius: 999px;
    font-family: var(--hand);
    font-size: 15.5px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .badge.soon { background: var(--ok-band); color: var(--ok-ink); }
  .badge.today { background: var(--warn-band); color: var(--warn-ink); }
  .badge.later { color: var(--ink3); font-weight: 400; }

  /* 할 일 줄 */

  .tasks { padding: 6px 20px 0; }

  .task {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 15px 0;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .task + .task { border-top: 1px dashed var(--line); }

  .check {
    flex: none;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--edge);
    color: transparent;
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
  }
  .check svg { width: 15px; height: 15px; }
  .task:active .check { transform: scale(.88); }

  .task-name {
    flex: 1;
    font-family: var(--hand);
    font-size: 19px;
    letter-spacing: -.01em;
    transition: color .18s ease;
  }

  .task.done .check {
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }
  .task.done .task-name {
    color: var(--ink3);
    text-decoration: line-through;
    text-decoration-color: var(--edge);
  }
  .task.done .badge { opacity: .45; }

  .card-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    padding: 14px 20px 16px;
    border-top: 1px solid var(--line);
  }
  .count {
    flex: 1;
    font-family: var(--hand);
    font-size: 18px;
    color: var(--ink2);
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--ink); font-weight: 400; }

  .ghost-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: var(--card);
    font-family: var(--hand);
    font-size: 16px;
    color: var(--ink2);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .ghost-btn:active { transform: scale(.96); background: var(--bg); }
  .ghost-btn svg { width: 13px; height: 13px; }

  /* 주기 도래 */

  .cycle {
    background: var(--band);
    border-color: #f3e3b8;
  }
  .cycle .card-head { padding-bottom: 0; }

  .link-btn {

<script>
  // 체크하면 남은 개수와 완료 개수가 같이 움직인다 — 시안도 눌러봐야 감이 온다
  const tasks = Array.from(document.querySelectorAll('.task'));
  const pill = document.getElementById('left-pill');
  const doneCount = document.getElementById('done-count');

  function sync() {
    const done = tasks.filter((t) => t.classList.contains('done')).length;
    const left = tasks.length - done;
    doneCount.textContent = done;
    pill.textContent = left > 0 ? left + '개 남음' : '다 했어요!';
    pill.classList.toggle('clear', left === 0);
  }

  tasks.forEach((t) => {
    t.addEventListener('click', () => {
      const on = t.classList.toggle('done');
      t.setAttribute('aria-pressed', String(on));
      sync();
    });
  });

  // 시안에 없는 화면은 조용히 알려준다
  const toast = document.getElementById('toast');
  let timer;
  document.querySelectorAll('[data-soon]').forEach((el) => {
    el.addEventListener('click', () => {
      toast.textContent = el.dataset.soon;
      toast.classList.add('on');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('on'), 1900);
    });
  });

  sync();
</script>
