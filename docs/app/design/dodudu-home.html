<title>도도두 홈 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gowun+Dodum&display=swap">

<style>
  /*
   * 도도두 홈 시안 — 손그림 감성의 첫 화면.
   *
   * 색은 전부 여기 :root 한 블록에서만 정한다 (앱의 globals.css와 같은 규칙).
   * 바깥 배경(--page*)만 어두운 화면을 따라가고, 폰 안쪽은 기기 화면이라 늘 밝다.
   */
  :root {
    /* 바깥 — 시안을 올려두는 책상 */
    --page: #efe7d9;
    --page-2: #f7f1e6;
    --page-ink: #857b6f;
    --page-line: #ded4c4;
    --shadow: 0 26px 60px rgba(96, 82, 62, .18), 0 3px 10px rgba(96, 82, 62, .08);

    /* 안쪽 — 앱 화면 */
    --bg: #fdf8e7;
    --card: #fffdf6;
    --band: #fcf1cf;
    --ink: #4b443e;
    --ink2: #8b8177;
    --ink3: #aba298;
    --line: #efe7d6;
    --edge: #dcd4c4;

    --tomato: #ee4b3b;
    --leaf: #8daf4b;
    --sprout: #a9ce7e;
    --sprout-deep: #93bd63;

    --ok-band: #e4f0d2;
    --ok-ink: #6e9440;
    --warn-band: #fbdcda;
    --warn-ink: #d9584a;
    --sage: #7fb08a;

    --dirt: #d9b78d;
    --grass: #cfe39a;
    --sun: #ffd34e;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #221f1c;
      --page-2: #2b2723;
      --page-ink: #a79c8e;
      --page-line: #3a342d;
      --shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .3);
    }
  }
  :root[data-theme="dark"] {
    --page: #221f1c;
    --page-2: #2b2723;
    --page-ink: #a79c8e;
    --page-line: #3a342d;
    --shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 16px 22px;
    background: radial-gradient(120% 90% at 50% 0%, var(--page-2), var(--page));
    color: var(--page-ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ─────────────── 기기 ─────────────── */

  .phone {
    position: relative;
    width: min(392px, 100%);
    height: min(846px, 100dvh - 92px);
    min-height: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 40px;
    background: var(--bg);
    box-shadow: var(--shadow);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -.01em;
  }

  /* 종이결 — 아주 옅게 깔아 크레용 그림과 톤을 맞춘다 */
  .phone::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: .5;
    background-image: radial-gradient(rgba(150, 130, 90, .09) .6px, transparent .7px);
    background-size: 4px 4px;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding: 0 20px calc(112px);
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ─────────────── 머리줄 ─────────────── */

  .appbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 2px 6px;
  }

  .logo {
    flex: 1;
    text-align: center;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--leaf);
    margin: 0;
  }
  .logo .do { color: var(--tomato); }
  .logo .dot { color: var(--leaf); }

  .icon-btn {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:active { transform: scale(.9); background: rgba(0, 0, 0, .04); }
  .icon-btn svg { width: 25px; height: 25px; }
  .icon-btn .dot-alert {
    position: absolute;
    top: 3px;
    right: 4px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--tomato);
    box-shadow: 0 0 0 2px var(--bg);
  }

  /* ─────────────── 인사 ─────────────── */

  .hello {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 6px 0 18px;
    min-height: 168px;
  }

  .hello-words {
    flex: 1;
    padding-bottom: 34px;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 23px;
    line-height: 1.45;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .sun {
    display: block;
    width: 62px;
    height: 62px;
    margin: 0 0 4px -6px;
    animation: sway 7s ease-in-out infinite;
  }

  .hello-art {
    flex: none;
    width: 208px;
    margin: 0 -24px -6px -46px;
    animation: bob 5.5s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(-1.2deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(14deg); }
  }

  /* ─────────────── 카드 ─────────────── */

  .card {
    border-radius: 22px;
    background: var(--card);
    box-shadow: 0 8px 22px rgba(120, 100, 70, .07);
    border: 1px solid var(--line);
  }
  .card + .card { margin-top: 16px; }

  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 20px 4px;
  }
  .card-title {
    margin: 0;
    flex: 1;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -.02em;
  }

  .pill {
    flex: none;
    padding: 4px 13px;
    border-radius: 999px;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 16px;
    line-height: 1.35;
    font-weight: 700;
    background: var(--warn-band);
    color: var(--warn-ink);
    font-variant-numeric: tabular-nums;
    transition: background .2s ease, color .2s ease;
  }
  .pill.clear { background: var(--ok-band); color: var(--ok-ink); }

  .badge {
    flex: none;
    padding: 3px 12px;
    border-radius: 999px;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .badge.soon { background: var(--ok-band); color: var(--ok-ink); }
  .badge.today { background: var(--warn-band); color: var(--warn-ink); }
  .badge.later { color: var(--ink3); font-weight: 400; }

  /* 할 일 줄 */

  .tasks { padding: 6px 20px 0; }

  .task {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 15px 0;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .task + .task { border-top: 1px dashed var(--line); }

  .check {
    flex: none;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--edge);
    color: transparent;
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
  }
  .check svg { width: 15px; height: 15px; }
  .task:active .check { transform: scale(.88); }

  .task-name {
    flex: 1;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 19px;
    letter-spacing: -.01em;
    transition: color .18s ease;
  }

  .task.done .check {
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }
  .task.done .task-name {
    color: var(--ink3);
    text-decoration: line-through;
    text-decoration-color: var(--edge);
  }
  .task.done .badge { opacity: .45; }

  .card-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    padding: 14px 20px 16px;
    border-top: 1px solid var(--line);
  }
  .count {
    flex: 1;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 18px;
    color: var(--ink2);
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--ink); font-weight: 700; }

  .ghost-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: var(--card);
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 16px;
    color: var(--ink2);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .ghost-btn:active { transform: scale(.96); background: var(--bg); }
  .ghost-btn svg { width: 13px; height: 13px; }

  /* 주기 도래 */

  .cycle {
    background: var(--band);
    border-color: #f3e3b8;
  }
  .cycle .card-head { padding-bottom: 0; }

  .link-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 2px;
    border: 0;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: var(--ink2);
    cursor: pointer;
  }
  .link-btn svg { width: 12px; height: 12px; }
  .link-btn:active { color: var(--ink); }

  .cycle-body {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 20px 20px 12px;
  }

  .cycle-art {
    flex: none;
    width: 122px;
    align-self: flex-end;
    margin-bottom: -4px;
  }

  .cycle-list { flex: 1; min-width: 0; }

  .cycle-row { padding: 10px 0; }
  .cycle-row + .cycle-row { border-top: 1px dashed #eadcb4; }
  .cycle-row .row-top {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .cycle-name {
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 19px;
    letter-spacing: -.01em;
  }
  .cycle-meta {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--ink2);
    font-variant-numeric: tabular-nums;
  }

  /* ─────────────── 탭 ─────────────── */

  .tabs {
    position: relative;
    z-index: 2;
    flex: none;
    display: flex;
    align-items: flex-end;
    padding: 8px 6px 16px;
    background: var(--card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(120, 100, 70, .06);
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0 2px;
    border: 0;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 11.5px;
    color: var(--ink3);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .tab:active { transform: scale(.92); }
  .tab svg { width: 27px; height: 27px; }
  .tab.on { color: var(--tomato); }

  .tab-gap { flex: 1; }

  .fab {
    position: absolute;
    left: 50%;
    bottom: 46px;
    width: 66px;
    height: 66px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: radial-gradient(75% 75% at 34% 28%, var(--sprout), var(--sprout-deep));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(120, 150, 80, .3);
    transform: translateX(-50%);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .fab:active {
    transform: translateX(-50%) scale(.93);
    box-shadow: 0 6px 12px rgba(120, 150, 80, .28);
  }
  .fab svg { width: 30px; height: 30px; }

  /* ─────────────── 토스트 ─────────────── */

  .toast {
    position: absolute;
    left: 50%;
    bottom: 120px;
    z-index: 5;
    max-width: 78%;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(75, 68, 62, .93);
    color: #fdf8e7;
    font-family: 'Gaegu', 'Gowun Dodum', cursive;
    font-size: 16px;
    text-align: center;
    transform: translate(-50%, 10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ─────────────── 시안 이름표 ─────────────── */

  .caption {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    letter-spacing: .02em;
    color: var(--page-ink);
  }
  .caption .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--tomato);
  }
  .caption .swatch + .swatch { background: var(--leaf); margin-left: -5px; }

  :focus-visible {
    outline: 2px solid var(--leaf);
    outline-offset: 2px;
    border-radius: 10px;
  }

  @media (max-width: 480px) {
    body { padding: 0; gap: 0; }
    .phone {
      width: 100%;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
    .caption { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<!-- 아이콘 한 벌 — 선은 둥글게, 굵기는 1.9로 통일 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="crayon" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="9" result="n"/>

<div class="phone">
  <div class="screen">

    <header class="appbar">
      <button class="icon-btn" type="button" aria-label="메뉴">
        <svg viewBox="0 0 24 24"><use href="#i-menu"/></svg>
      </button>
      <h1 class="logo"><span class="do">do</span><span class="dot">·</span>dodu</h1>
      <button class="icon-btn" type="button" aria-label="알림 — 새로 온 것이 있음">
        <svg viewBox="0 0 24 24"><use href="#i-bell"/></svg>
        <span class="dot-alert"></span>
      </button>
      <button class="icon-btn" type="button" aria-label="우리 방 사람들">
        <svg viewBox="0 0 24 24"><use href="#i-people"/></svg>
      </button>
    </header>

    <section class="hello">
      <div class="hello-words">
        <!-- 해 -->
        <svg class="sun" viewBox="0 0 60 60" aria-hidden="true" filter="url(#crayon-soft)">
          <g stroke="var(--sun)" stroke-width="4.2" stroke-linecap="round">
            <path d="M30 5v7M30 48v7M5 30h7M48 30h7M12.2 12.2l5 5M42.8 42.8l5 5M47.8 12.2l-5 5M17.2 42.8l-5 5"/>
          </g>
          <circle cx="30" cy="30" r="11.5" fill="var(--sun)"/>
        </svg>
        안녕하세요!<br>오늘도 도도두와 함께해요 :)
      </div>

      <!-- 엎드린 토마토 -->
      <svg class="hello-art" viewBox="0 0 220 168" aria-hidden="true">
        <ellipse cx="112" cy="140" rx="94" ry="21" fill="var(--grass)" filter="url(#crayon)"/>
        <g stroke="#b7d383" stroke-width="3.4" stroke-linecap="round" filter="url(#crayon-soft)">
          <path d="M26 136c-3-7-2-12 1-16M34 138c1-6 4-10 8-12M190 133c3-6 3-11 1-15M180 138c-1-6-4-9-8-11"/>

<p class="caption"><span class="swatch"></span><span class="swatch"></span> do·dodu 홈 화면 시안 · 체크해 보세요</p>

<script>
  // 체크하면 남은 개수와 완료 개수가 같이 움직인다 — 시안도 눌러봐야 감이 온다
  const tasks = Array.from(document.querySelectorAll('.task'));
  const pill = document.getElementById('left-pill');
  const doneCount = document.getElementById('done-count');

  function sync() {
    const done = tasks.filter((t) => t.classList.contains('done')).length;
    const left = tasks.length - done;
    doneCount.textContent = done;
    pill.textContent = left > 0 ? left + '개 남음' : '다 했어요!';
    pill.classList.toggle('clear', left === 0);
  }

  tasks.forEach((t) => {
    t.addEventListener('click', () => {
      const on = t.classList.toggle('done');
      t.setAttribute('aria-pressed', String(on));
      sync();
    });
  });

  // 시안에 없는 화면은 조용히 알려준다
  const toast = document.getElementById('toast');
  let timer;
  document.querySelectorAll('[data-soon]').forEach((el) => {
    el.addEventListener('click', () => {
      toast.textContent = el.dataset.soon;
      toast.classList.add('on');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('on'), 1900);
    });
  });

  sync();
</script>
