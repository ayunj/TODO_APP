<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곰돌이 규격 맞추기 — 1800×1800</title>
<style>
  :root{
    --paper:#FDF8F0;
    --paper-2:#F6EDE0;
    --ink:#6B4A2E;
    --ink-soft:#9A7B5E;
    --line:#E3D2BC;
    --guide:#E8608C;
    --guide-soft:#F7C9D8;
    --plum:#8E7CC3;
    --plum-soft:#EDE7F8;
    --ok:#5FA98C;
    --shadow:0 1px 0 rgba(107,74,46,.08), 0 8px 24px -14px rgba(107,74,46,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    padding:20px 16px 56px;
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* ── 헤더: 사양서처럼 ── */
  header{
    border:1.5px solid var(--guide-soft);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:18px;
    background:#fff;
    box-shadow:var(--shadow);
  }
  .eyebrow{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--guide);font-weight:700;margin:0 0 4px;
  }
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
  header p{margin:6px 0 0;font-size:13px;color:var(--ink-soft)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} }

  /* ── 스테이지 ── */
  .stage{
    position:relative;background:#fff;border:1.5px solid var(--line);
    border-radius:16px;padding:10px;box-shadow:var(--shadow);
  }
  .canvas-box{position:relative;width:100%;aspect-ratio:1/1;border-radius:9px;overflow:hidden;touch-action:none;cursor:grab}
  .canvas-box.dragging{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}
  .drop-hint{
    position:absolute;inset:10px;border:2px dashed var(--guide-soft);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--ink-soft);font-size:13px;text-align:center;pointer-events:none;background:rgba(253,248,240,.82);
    padding:20px;
  }
  .drop-hint strong{color:var(--ink);font-size:14px}
  .drop-hint.hide{display:none}
  .canvas-box.over .drop-hint{border-color:var(--guide);background:rgba(247,201,216,.35)}

  /* ── 패널 ── */
  .panel{display:flex;flex-direction:column;gap:12px}
  .card{
    background:#fff;border:1.5px solid var(--line);border-radius:14px;
    padding:13px 14px;box-shadow:var(--shadow);
  }
  .card h2{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    margin:0 0 10px;font-weight:700;
  }
  label.field{display:block;margin-bottom:12px}
  label.field:last-child{margin-bottom:0}
  .field-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
  .field-top b{font-weight:600}
  .field-top span{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:12px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--paper-2);border-radius:99px}
  input[type=range]::-moz-range-track{height:4px;background:var(--paper-2);border-radius:99px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
    border:2.5px solid var(--guide);margin-top:-7px;cursor:pointer;box-shadow:0 1px 3px rgba(107,74,46,.25)
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:#fff;border:2.5px solid var(--guide);
    cursor:pointer;box-shadow:0 1px 3px rgba(107,74,46,.25)
  }

  button{font:inherit;cursor:pointer;border-radius:9px;transition:transform .06s ease, background .15s ease}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px}
  .btn{
    display:block;width:100%;padding:10px 12px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:600;
  }
  .btn:hover{background:var(--paper-2)}
  .btn.primary{background:var(--guide);border-color:var(--guide);color:#fff}
  .btn.primary:hover{background:#dd4f7f}
  .btn.ghost{background:#fff}
  .btn + .btn{margin-top:8px}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn-row .btn{margin-top:0}

  .file-btn{
    display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;
    border:1.5px dashed var(--guide);border-radius:10px;background:#fff;color:var(--guide);
    font-size:13.5px;font-weight:700;
  }
  .file-btn:hover{background:var(--guide-soft)}
  input[type=file]{display:none}

  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0;cursor:pointer;user-select:none}
  .toggle input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--paper-2);
    border:1.5px solid var(--line);position:relative;margin:0;cursor:pointer;flex:none;transition:background .15s}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
  .toggle input:checked{background:var(--plum);border-color:var(--plum)}
  .toggle input:checked::after{transform:translateX(15px)}
  .toggle input:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px}

  /* ── 수치 판독 ── */
  .readout{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .readout dt{color:var(--ink-soft)}
  .readout dd{margin:0;text-align:right;font-weight:600}
  .chip{
    display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 10px;border-radius:99px;
    font-size:12px;font-weight:700;background:var(--paper-2);color:var(--ink-soft);
  }
  .chip.good{background:#E6F3EC;color:var(--ok)}
  .empty{font-size:12.5px;color:var(--ink-soft);margin:0}

  footer{margin-top:22px;font-size:12px;color:var(--ink-soft);text-align:center}
  kbd{
    font-family:inherit;font-size:11px;background:var(--paper-2);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink)
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">1800 × 1800 · 배경 투명</p>
    <h1>곰돌이 규격 맞추기</h1>
    <p>생성된 그림을 올리면 발바닥 y=1640, 중심 x=900에 맞춰 정렬합니다. 반투명 기준 곰돌이에 몸 크기를 겹쳐 맞추세요.</p>
  </header>

  <div class="layout">
    <div class="stage">
      <div class="canvas-box" id="box">
        <canvas id="cv" width="900" height="900"></canvas>
        <div class="drop-hint" id="hint">
          <strong>PNG를 여기로 끌어다 놓으세요</strong>
          <span>또는 오른쪽 &lsquo;그림 불러오기&rsquo;</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="card">
        <h2>그림</h2>
        <button class="file-btn" id="pick" type="button">＋ 그림 불러오기</button>
        <input type="file" id="file" accept="image/*">
        <label class="toggle" style="margin-top:11px">
          <input type="checkbox" id="keyWhite" checked>
          <span>흰 배경 지우기</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="showGhost" checked>
          <span>기준 곰돌이 겹쳐 보기</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="showGuide" checked>
          <span>가이드선 보기</span>
        </label>
      </div>

      <div class="card">
        <h2>맞추기</h2>
        <label class="field">
          <span class="field-top"><b>크기</b><span id="vScale">—</span></span>
          <input type="range" id="rScale" min="5" max="300" value="100" step="0.5">
        </label>
        <label class="field">
          <span class="field-top"><b>좌우</b><span id="vX">—</span></span>
          <input type="range" id="rX" min="-900" max="900" value="0" step="1">
        </label>
        <label class="field">
          <span class="field-top"><b>상하</b><span id="vY">—</span></span>
          <input type="range" id="rY" min="-900" max="900" value="0" step="1">
        </label>
        <button class="btn primary" id="snap" type="button">발바닥 · 중앙 자동 정렬</button>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn ghost" id="fit" type="button">크기 초기화</button>
          <button class="btn ghost" id="reset" type="button">전체 되돌리기</button>
        </div>
      </div>

      <div class="card">
        <h2>현재 수치</h2>
        <div id="readWrap"><p class="empty">그림을 불러오면 표시됩니다.</p></div>
      </div>

      <div class="card">
        <h2>내보내기</h2>
        <button class="btn primary" id="save" type="button">1800×1800 PNG 저장</button>
      </div>
    </div>
  </div>

  <footer>
    드래그로 이동 · <kbd>방향키</kbd> 1px · <kbd>Shift</kbd>+방향키 10px · 휠로 크기 조절
  </footer>
</div>

(function(){

  /* ── 배경 제거: 가장자리에서 번져 들어가는 방식이라 얼굴의 흰 부분은 남는다 ── */
  function keyOutWhite(source){
    var w = source.width, h = source.height;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.drawImage(source, 0, 0);
    var id = x.getImageData(0, 0, w, h), d = id.data;
    var n = w * h;
    var seen = new Uint8Array(n);
    var stack = new Int32Array(n);
    var sp = 0;

    function isBG(i){
      var p = i * 4;
      return d[p+3] > 8 && d[p] > 226 && d[p+1] > 222 && d[p+2] > 214;
    }
    function push(i){ if(!seen[i] && isBG(i)){ seen[i] = 1; stack[sp++] = i; } }

    for(var xx = 0; xx < w; xx++){ push(xx); push((h-1)*w + xx); }
    for(var yy = 0; yy < h; yy++){ push(yy*w); push(yy*w + w - 1); }

    while(sp > 0){
      var i = stack[--sp];
      d[i*4+3] = 0;
      var cx = i % w, cy = (i - cx) / w;
      if(cx > 0) push(i-1);
      if(cx < w-1) push(i+1);
      if(cy > 0) push(i-w);
      if(cy < h-1) push(i+w);
    }
    x.putImageData(id, 0, 0);
    return c;
  }

  function findBBox(c){
    var w = c.width, h = c.height;
    var d = c.getContext('2d').getImageData(0,0,w,h).data;
    var minX = w, minY = h, maxX = -1, maxY = -1;
    for(var y = 0; y < h; y++){
      for(var x = 0; x < w; x++){
        if(d[(y*w+x)*4+3] > 16){
          if(x < minX) minX = x;
          if(x > maxX) maxX = x;
          if(y < minY) minY = y;
          if(y > maxY) maxY = y;
        }
      }
    }
    if(maxX < 0) return null;
    return { x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1 };
  }

  function rebuild(){
    if(!srcRaw) return;
    srcUse = el.keyWhite.checked ? keyOutWhite(srcRaw) : srcRaw;
    bbox = findBBox(srcUse);

    baseScale = TARGET_H / bbox.h;

  function anchor(){
    var s = st.scale;
    return {

      ty: FOOT_Y - (bbox.y + bbox.h) * s + st.dy
    };
  }

    var s = st.scale, a = anchor();
    c2.drawImage(srcUse, a.tx, a.ty, srcUse.width * s, srcUse.height * s);
  }

      }
    }
  }

    c2.strokeStyle = 'rgba(232,96,140,.75)';
    c2.beginPath(); c2.moveTo(0, FOOT_Y); c2.lineTo(SIZE, FOOT_Y); c2.stroke();
    c2.strokeStyle = 'rgba(142,124,195,.75)';
    c2.beginPath(); c2.moveTo(0, HEAD_Y); c2.lineTo(SIZE, HEAD_Y); c2.stroke();
    c2.strokeStyle = 'rgba(232,96,140,.45)';
    c2.beginPath(); c2.moveTo(CX, 0); c2.lineTo(CX, SIZE); c2.stroke();

    c2.setLineDash([]);

    c2.fillStyle = '#8E7CC3';

    c2.fillText('발바닥 y=1640', 28, FOOT_Y + 56);
    c2.restore();

  function draw(){

    ctx.clearRect(0, 0, VIEW, VIEW);

      '</dl>' +
      '<span class="chip' + (aligned ? ' good' : '') + '">' +
        (aligned ? '✓ 규격에 맞음' : '· 자동 정렬 필요') + '</span>';

    el.vScale.textContent = Math.round(s / baseScale * 100) + '%';
    el.vX.textContent = (st.dx > 0 ? '+' : '') + Math.round(st.dx) + 'px';
    el.vY.textContent = (st.dy > 0 ? '+' : '') + Math.round(st.dy) + 'px';
    el.rScale.value = Math.min(300, Math.max(5, s / baseScale * 100));
    el.rX.value = Math.max(-900, Math.min(900, st.dx));
    el.rY.value = Math.max(-900, Math.min(900, st.dy));
  }

  /* ── 파일 불러오기 ── */
  function loadFile(f){
    if(!f || !/^image\//.test(f.type)) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function(){
      var c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);
      srcRaw = c;
      rebuild();
      st.scale = baseScale; st.dx = 0; st.dy = 0;
      hint.classList.add('hide');
      draw();
      URL.revokeObjectURL(url);
    };
    im.src = url;
  }

  document.getElementById('pick').addEventListener('click', function(){
    document.getElementById('file').click();
  });
  document.getElementById('file').addEventListener('change', function(e){
    loadFile(e.target.files[0]); e.target.value = '';
  });
  ['dragenter','dragover'].forEach(function(t){
    box.addEventListener(t, function(e){ e.preventDefault(); box.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(t){
    box.addEventListener(t, function(e){ e.preventDefault(); box.classList.remove('over'); });
  });
  box.addEventListener('drop', function(e){
    if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  /* ── 조작 ── */
  el.keyWhite.addEventListener('change', function(){
    if(!srcRaw) return;
    var pct = st.scale / baseScale;
    rebuild();
    st.scale = baseScale * pct;
    draw();
  });
  el.showGhost.addEventListener('change', draw);
  el.showGuide.addEventListener('change', draw);

  el.rScale.addEventListener('input', function(){
    if(!srcUse) return;
    st.scale = baseScale * (parseFloat(this.value) / 100);
    draw();
  });
  el.rX.addEventListener('input', function(){ if(!srcUse) return; st.dx = parseFloat(this.value); draw(); });
  el.rY.addEventListener('input', function(){ if(!srcUse) return; st.dy = parseFloat(this.value); draw(); });

  document.getElementById('snap').addEventListener('click', function(){
    if(!srcUse) return;
    st.dx = 0; st.dy = 0; draw();
  });
  document.getElementById('fit').addEventListener('click', function(){
    if(!srcUse) return;
    st.scale = baseScale; draw();
  });
  document.getElementById('reset').addEventListener('click', function(){
    if(!srcUse) return;
    st.scale = baseScale; st.dx = 0; st.dy = 0; draw();
  });

  var dragging = false, lastX = 0, lastY = 0;
  box.addEventListener('pointerdown', function(e){
    if(!srcUse) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    box.setPointerCapture(e.pointerId); box.classList.add('dragging');
  });
  box.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var r = box.getBoundingClientRect(), k = SIZE / r.width;
    st.dx += (e.clientX - lastX) * k;
    st.dy += (e.clientY - lastY) * k;
    lastX = e.clientX; lastY = e.clientY;
    draw();
  });
  ['pointerup','pointercancel'].forEach(function(t){
    box.addEventListener(t, function(){ dragging = false; box.classList.remove('dragging'); });
  });
  box.addEventListener('wheel', function(e){
    if(!srcUse) return;
    e.preventDefault();
    st.scale *= (e.deltaY < 0 ? 1.04 : 1/1.04);
    st.scale = Math.max(baseScale*0.05, Math.min(baseScale*3, st.scale));
    draw();
  }, { passive:false });

  window.addEventListener('keydown', function(e){
    if(!srcUse) return;
    var step = e.shiftKey ? 10 : 1, hit = true;
    if(e.key === 'ArrowLeft') st.dx -= step;
    else if(e.key === 'ArrowRight') st.dx += step;
    else if(e.key === 'ArrowUp') st.dy -= step;
    else if(e.key === 'ArrowDown') st.dy += step;
    else hit = false;
    if(hit){ e.preventDefault(); draw(); }
  });

  /* ── 저장: 가이드·기준곰 없이 투명 1800×1800 ── */
  document.getElementById('save').addEventListener('click', function(){
    if(!srcUse) return;
    var out = document.createElement('canvas');
    out.width = SIZE; out.height = SIZE;
    drawArt(out.getContext('2d'), true);
    out.toBlob(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'bear_1800.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    }, 'image/png');
  });

  draw();
})();

</script>
</body>
</html>
